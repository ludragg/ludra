syntax = "proto3";

package ludra.v1;

import "ludra/v1/models.proto";

message ClientFrame {
  uint32 request_id = 1;

  oneof payload {
    Login login = 2;
    ListConversations list_conversations = 3;
    OpenConversation open_conversation = 4;
    LoadMessages load_messages = 5;
    SendMessage send_message = 6;
    Register register = 7;
    Resume resume = 8;
    Logout logout = 9;
    VerifyEmail verify_email = 10;
    SendCode send_code = 11;
    ResetPassword reset_password = 12;
    ListFriends list_friends = 13;
    AddFriend add_friend = 14;
    AcceptFriend accept_friend = 15;
    RemoveFriend remove_friend = 16;
    SetPresence set_presence = 17;
  }
}

enum CodePurpose {
  CODE_PURPOSE_UNSPECIFIED = 0;
  CODE_PURPOSE_VERIFY_EMAIL = 1;
  CODE_PURPOSE_RESET_PASSWORD = 2;
}

message Register {
  string email = 1;
  string username = 2;
  string password = 3;
}

message Login {
  string login = 1;
  string password = 2;
}

message VerifyEmail {
  string email = 1;
  string code = 2;
}

message SendCode {
  string email = 1;
  CodePurpose purpose = 2;
}

message ResetPassword {
  string email = 1;
  string code = 2;
  string password = 3;
}

message Resume {
  string token = 1;
}

message Logout {}

message ListFriends {}

message AddFriend {
  string username = 1;
}

message AcceptFriend {
  string user_id = 1;
}

message RemoveFriend {
  string user_id = 1;
}

message SetPresence {
  Presence presence = 1;
}

message ListConversations {}

message OpenConversation {
  string username = 1;
}

message LoadMessages {
  string conversation_id = 1;
  string before_id = 2;
  uint32 limit = 3;
}

message SendMessage {
  string conversation_id = 1;
  string content = 2;
}
