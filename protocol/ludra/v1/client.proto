syntax = "proto3";

package ludra.v1;

import "ludra/v1/models.proto";

message ClientFrame {
  uint32 request_id = 1;

  oneof payload {
    Login login = 2;
    ListConversations list_conversations = 3;
    OpenConversation open_conversation = 4;
    LoadMessages load_messages = 5;
    SendMessage send_message = 6;
    Register register = 7;
    Resume resume = 8;
    Logout logout = 9;
    VerifyEmail verify_email = 10;
    SendCode send_code = 11;
    ResetPassword reset_password = 12;
    ListFriends list_friends = 13;
    AddFriend add_friend = 14;
    AcceptFriend accept_friend = 15;
    RemoveFriend remove_friend = 16;
    SetPresence set_presence = 17;
    VerifyTwoFactor verify_two_factor = 18;
    ResendTwoFactor resend_two_factor = 19;
    ChangePassword change_password = 20;
    SetTwoFactor set_two_factor = 21;
    SetAvatar set_avatar = 22;
    RemoveAvatar remove_avatar = 23;
    StartCall start_call = 24;
    AnswerCall answer_call = 25;
    EndCall end_call = 26;
    CallSignal call_signal = 27;
    CreateGroup create_group = 28;
    AddGroupMembers add_group_members = 29;
    RemoveGroupMember remove_group_member = 30;
    LeaveGroup leave_group = 31;
    JoinGroupCall join_group_call = 32;
    LeaveGroupCall leave_group_call = 33;
    DeclineGroupCall decline_group_call = 34;
    DeleteGroup delete_group = 35;
    TransferGroup transfer_group = 36;
    BlockUser block_user = 37;
    UnblockUser unblock_user = 38;
    ListBlocked list_blocked = 39;
    SetGroupAvatar set_group_avatar = 40;
    SetIdentityKey set_identity_key = 41;
    ListIdentityKeys list_identity_keys = 42;
    Ping ping = 43;
    EditMessage edit_message = 44;
    DeleteMessage delete_message = 45;
    SetUsername set_username = 46;
  }
}

message Ping {}

enum CodePurpose {
  CODE_PURPOSE_UNSPECIFIED = 0;
  CODE_PURPOSE_VERIFY_EMAIL = 1;
  CODE_PURPOSE_RESET_PASSWORD = 2;
}

message Register {
  string email = 1;
  string username = 2;
  string password = 3;
  string locale = 4;
}

message Login {
  string login = 1;
  string password = 2;
  string locale = 3;
}

message VerifyEmail {
  string email = 1;
  string code = 2;
}

message SendCode {
  string email = 1;
  CodePurpose purpose = 2;
  string locale = 3;
}

message ResetPassword {
  string email = 1;
  string code = 2;
  string password = 3;
}

message VerifyTwoFactor {
  string code = 1;
}

message ResendTwoFactor {
  string locale = 1;
}

message ChangePassword {
  string current_password = 1;
  string new_password = 2;
}

message SetTwoFactor {
  bool enabled = 1;
  string password = 2;
}

message SetAvatar {
  bytes image = 1;
}

message RemoveAvatar {}

message Resume {
  string token = 1;
}

message Logout {}

message ListFriends {}

message AddFriend {
  string username = 1;
}

message AcceptFriend {
  string user_id = 1;
}

message RemoveFriend {
  string user_id = 1;
}

message SetPresence {
  Presence presence = 1;
}

message ListConversations {}

message OpenConversation {
  string username = 1;
}

message LoadMessages {
  string conversation_id = 1;
  string before_id = 2;
  uint32 limit = 3;
}

message SendMessage {
  string conversation_id = 1;
  string content = 2;
}

message EditMessage {
  string message_id = 1;
  string content = 2;
}

message DeleteMessage {
  string message_id = 1;
}

message SetUsername {
  string username = 1;
}

message StartCall {
  string user_id = 1;
  bool direct = 2;
}

message AnswerCall {
  string call_id = 1;
  bool direct = 2;
}

message EndCall {
  string call_id = 1;
}

message CreateGroup {
  string name = 1;
  repeated string member_ids = 2;
}

message AddGroupMembers {
  string conversation_id = 1;
  repeated string user_ids = 2;
}

message RemoveGroupMember {
  string conversation_id = 1;
  string user_id = 2;
}

message LeaveGroup {
  string conversation_id = 1;
}

message JoinGroupCall {
  string conversation_id = 1;
  bool direct = 2;
}

message LeaveGroupCall {
  string call_id = 1;
}

message DeclineGroupCall {
  string conversation_id = 1;
}

message DeleteGroup {
  string conversation_id = 1;
}

message BlockUser {
  string user_id = 1;
}

message UnblockUser {
  string user_id = 1;
}

message ListBlocked {}

message SetIdentityKey {
  string key = 1;
}

message ListIdentityKeys {
  repeated string user_ids = 1;
}

message SetGroupAvatar {
  string conversation_id = 1;
  bytes image = 2;
}

message TransferGroup {
  string conversation_id = 1;
  string user_id = 2;
}
