syntax = "proto3";

package ludra.v1;

import "ludra/v1/models.proto";

message ServerFrame {
  uint32 request_id = 1;

  oneof payload {
    Error error = 2;
    LoggedIn logged_in = 3;
    ConversationList conversation_list = 4;
    ConversationOpened conversation_opened = 5;
    MessageHistory message_history = 6;
    MessageCreated message_created = 7;
    PresenceChanged presence_changed = 8;
    LoggedOut logged_out = 9;
    VerificationRequired verification_required = 10;
    CodeSent code_sent = 11;
    FriendList friend_list = 12;
    FriendUpdated friend_updated = 13;
    FriendRemoved friend_removed = 14;
    TwoFactorRequired two_factor_required = 15;
    PasswordChanged password_changed = 16;
    TwoFactorChanged two_factor_changed = 17;
    UserUpdated user_updated = 18;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_INTERNAL = 4;
  ERROR_CODE_INVALID_CREDENTIALS = 5;
  ERROR_CODE_ALREADY_EXISTS = 6;
  ERROR_CODE_INVALID_CODE = 7;
  ERROR_CODE_TOO_MANY_REQUESTS = 8;
  ERROR_CODE_FORBIDDEN = 9;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message LoggedIn {
  User user = 1;
  string token = 2;
  string email = 3;
  bool two_factor = 4;
}

message LoggedOut {}

message VerificationRequired {
  string email = 1;
}

message CodeSent {}

message ConversationList {
  repeated Conversation conversations = 1;
}

message ConversationOpened {
  Conversation conversation = 1;
}

message MessageHistory {
  string conversation_id = 1;
  repeated Message messages = 2;
  bool has_more = 3;
}

message MessageCreated {
  Message message = 1;
}

message PresenceChanged {
  string user_id = 1;
  Presence presence = 2;
}

message FriendList {
  repeated Friend friends = 1;
}

message FriendUpdated {
  Friend friend = 1;
}

message FriendRemoved {
  string user_id = 1;
}

message TwoFactorRequired {
  string email = 1;
}

message PasswordChanged {}

message TwoFactorChanged {
  bool enabled = 1;
}

message UserUpdated {
  User user = 1;
}
