syntax = "proto3";

package ludra.v1;

import "ludra/v1/models.proto";

message ServerFrame {
  uint32 request_id = 1;

  oneof payload {
    Error error = 2;
    LoggedIn logged_in = 3;
    ConversationList conversation_list = 4;
    ConversationOpened conversation_opened = 5;
    MessageHistory message_history = 6;
    MessageCreated message_created = 7;
    PresenceChanged presence_changed = 8;
    LoggedOut logged_out = 9;
    VerificationRequired verification_required = 10;
    CodeSent code_sent = 11;
    FriendList friend_list = 12;
    FriendUpdated friend_updated = 13;
    FriendRemoved friend_removed = 14;
    TwoFactorRequired two_factor_required = 15;
    PasswordChanged password_changed = 16;
    TwoFactorChanged two_factor_changed = 17;
    UserUpdated user_updated = 18;
    CallStarted call_started = 19;
    CallIncoming call_incoming = 20;
    CallAccepted call_accepted = 21;
    CallEnded call_ended = 22;
    CallSignal call_signal = 23;
    Ack ack = 24;
    MessageUpdated message_updated = 25;
    ConversationUpdated conversation_updated = 26;
    ConversationRemoved conversation_removed = 27;
    GroupCallJoined group_call_joined = 28;
    GroupCallUpdated group_call_updated = 29;
    GroupCallRinging group_call_ringing = 30;
    BlockedList blocked_list = 31;
    IdentityKeys identity_keys = 32;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_INTERNAL = 4;
  ERROR_CODE_INVALID_CREDENTIALS = 5;
  ERROR_CODE_ALREADY_EXISTS = 6;
  ERROR_CODE_INVALID_CODE = 7;
  ERROR_CODE_TOO_MANY_REQUESTS = 8;
  ERROR_CODE_FORBIDDEN = 9;
  ERROR_CODE_UNAVAILABLE = 10;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message LoggedIn {
  User user = 1;
  string token = 2;
  string email = 3;
  bool two_factor = 4;
}

message LoggedOut {}

message VerificationRequired {
  string email = 1;
}

message CodeSent {}

message ConversationList {
  repeated Conversation conversations = 1;
}

message ConversationOpened {
  Conversation conversation = 1;
}

message MessageHistory {
  string conversation_id = 1;
  repeated Message messages = 2;
  bool has_more = 3;
}

message MessageCreated {
  Message message = 1;
}

message PresenceChanged {
  string user_id = 1;
  Presence presence = 2;
}

message FriendList {
  repeated Friend friends = 1;
}

message IdentityKeys {
  map<string, string> keys = 1;
}

message BlockedList {
  repeated User users = 1;
}

message FriendUpdated {
  Friend friend = 1;
}

message FriendRemoved {
  string user_id = 1;
}

message TwoFactorRequired {
  string email = 1;
}

message PasswordChanged {}

message TwoFactorChanged {
  bool enabled = 1;
}

message UserUpdated {
  User user = 1;
}

message CallStarted {
  Call call = 1;
}

message CallIncoming {
  Call call = 1;
}

message CallAccepted {
  string call_id = 1;
}

enum CallEndReason {
  CALL_END_REASON_UNSPECIFIED = 0;
  CALL_END_REASON_HUNG_UP = 1;
  CALL_END_REASON_DECLINED = 2;
  CALL_END_REASON_MISSED = 3;
  CALL_END_REASON_ANSWERED_ELSEWHERE = 4;
  CALL_END_REASON_DISCONNECTED = 5;
}

message CallEnded {
  string call_id = 1;
  CallEndReason reason = 2;
}

message Ack {}

message MessageUpdated {
  Message message = 1;
}

message ConversationUpdated {
  Conversation conversation = 1;
}

message ConversationRemoved {
  string conversation_id = 1;
}

message GroupCallJoined {
  string call_id = 1;
  string conversation_id = 2;
  repeated IceServer ice_servers = 3;
  repeated string participant_ids = 4;
}

message GroupCallUpdated {
  string conversation_id = 1;
  GroupCall call = 2;
}

message GroupCallRinging {
  string conversation_id = 1;
  User starter = 2;
}
