syntax = "proto3";

package ludra.v1;

import "google/protobuf/timestamp.proto";

enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ONLINE = 1;
  PRESENCE_OFFLINE = 2;
  PRESENCE_INVISIBLE = 3;
  PRESENCE_BUSY = 4;
}

enum FriendState {
  FRIEND_STATE_UNSPECIFIED = 0;
  FRIEND_STATE_ACCEPTED = 1;
  FRIEND_STATE_INCOMING = 2;
  FRIEND_STATE_OUTGOING = 3;
}

message User {
  string id = 1;
  string username = 2;
  Presence presence = 3;
  string avatar = 4;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
  MESSAGE_KIND_CALL = 2;
  MESSAGE_KIND_EVENT = 3;
}

enum MessageEvent {
  MESSAGE_EVENT_UNSPECIFIED = 0;
  MESSAGE_EVENT_MEMBER_ADDED = 1;
  MESSAGE_EVENT_MEMBER_REMOVED = 2;
  MESSAGE_EVENT_MEMBER_LEFT = 3;
  MESSAGE_EVENT_OWNER_CHANGED = 4;
  MESSAGE_EVENT_GROUP_RENAMED = 5;
  MESSAGE_EVENT_PHOTO_CHANGED = 6;
  MESSAGE_EVENT_PHOTO_REMOVED = 7;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
}

message GroupCall {
  string id = 1;
  repeated string participant_ids = 2;
  google.protobuf.Timestamp started_at = 3;
  reserved 4;
  repeated string ringing_ids = 5;
  repeated string muted_ids = 6;
  repeated string deafened_ids = 7;
  repeated string sharing_ids = 8;
  repeated string direct_ids = 9;
  repeated string camera_ids = 10;
}

enum CallOutcome {
  CALL_OUTCOME_UNSPECIFIED = 0;
  CALL_OUTCOME_COMPLETED = 1;
  CALL_OUTCOME_DECLINED = 2;
  CALL_OUTCOME_MISSED = 3;
  CALL_OUTCOME_ONGOING = 4;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string content = 4;
  google.protobuf.Timestamp sent_at = 5;
  MessageKind kind = 6;
  CallOutcome call_outcome = 7;
  uint32 call_duration = 8;
  MessageEvent event = 9;
  string target_id = 10;
  string sender_name = 11;
  string target_name = 12;
  google.protobuf.Timestamp edited_at = 13;
}

message Friend {
  User user = 1;
  FriendState state = 2;
}

message Conversation {
  string id = 1;
  User peer = 2;
  Message last_message = 3;
  ConversationKind kind = 4;
  string name = 5;
  string owner_id = 6;
  repeated User members = 7;
  GroupCall call = 8;
  string avatar = 9;
}

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message Call {
  string id = 1;
  User peer = 2;
  repeated IceServer ice_servers = 3;
  bool direct = 4;
}

enum SignalKind {
  SIGNAL_KIND_UNSPECIFIED = 0;
  SIGNAL_KIND_OFFER = 1;
  SIGNAL_KIND_ANSWER = 2;
  SIGNAL_KIND_CANDIDATE = 3;
  SIGNAL_KIND_STATE = 4;
}

message CallSignal {
  string call_id = 1;
  SignalKind kind = 2;
  string payload = 3;
  string peer_id = 4;
}
