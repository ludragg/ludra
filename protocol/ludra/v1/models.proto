syntax = "proto3";

package ludra.v1;

import "google/protobuf/timestamp.proto";

enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ONLINE = 1;
  PRESENCE_OFFLINE = 2;
  PRESENCE_INVISIBLE = 3;
}

enum FriendState {
  FRIEND_STATE_UNSPECIFIED = 0;
  FRIEND_STATE_ACCEPTED = 1;
  FRIEND_STATE_INCOMING = 2;
  FRIEND_STATE_OUTGOING = 3;
}

message User {
  string id = 1;
  string username = 2;
  Presence presence = 3;
  string avatar = 4;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string content = 4;
  google.protobuf.Timestamp sent_at = 5;
}

message Friend {
  User user = 1;
  FriendState state = 2;
}

message Conversation {
  string id = 1;
  User peer = 2;
  Message last_message = 3;
}
