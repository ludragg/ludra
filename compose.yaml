services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ludra
      POSTGRES_PASSWORD: ludra
      POSTGRES_DB: ludra
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ludra"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres:
