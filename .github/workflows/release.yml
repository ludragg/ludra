name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  desktop:
    name: Desktop
    runs-on: windows-latest
    env:
      LUDRA_SERVER: ${{ vars.LUDRA_SERVER }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Check version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version $version"
            exit 1
          fi
          if [ -z "$LUDRA_SERVER" ]; then
            echo "Set the LUDRA_SERVER repository variable (e.g. wss://ludra.example.com/ws)"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release
          save-if: false

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - name: Release config
        working-directory: apps/desktop
        run: node scripts/release-config.mjs

      - name: Release notes
        id: notes
        working-directory: apps/desktop
        run: node scripts/release-notes.mjs

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_LUDRA_SERVER: ${{ vars.LUDRA_SERVER }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Ludra ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          assetNamePattern: "ludra-installer[ext]"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Remove signature asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name | endswith(".sig")) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
            done
