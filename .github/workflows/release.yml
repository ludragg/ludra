name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.installer.outputs.sha256 }}
    env:
      LUDRA_SERVER: ${{ vars.LUDRA_SERVER }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Check version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version $version"
            exit 1
          fi
          if [ -z "$LUDRA_SERVER" ]; then
            echo "Set the LUDRA_SERVER repository variable (e.g. wss://ludra.example.com/ws)"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release
          save-if: false

      - name: Install
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Release config
        working-directory: apps/desktop
        run: node scripts/release-config.mjs

      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          VITE_LUDRA_SERVER: ${{ vars.LUDRA_SERVER }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Collect installer
        id: installer
        shell: bash
        run: |
          shopt -s nullglob
          found=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "Expected exactly one NSIS installer, found ${#found[@]}"
            exit 1
          fi
          mkdir -p dist
          cp "${found[0]}" dist/ludra-installer.exe
          echo "sha256=$(sha256sum dist/ludra-installer.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer
          path: dist/ludra-installer.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer
          path: dist

      - name: Verify installer
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "${EXPECTED}  dist/ludra-installer.exe" | sha256sum --check --strict

      - name: Install signer
        run: |
          signer="${RUNNER_TEMP}/signer"
          node apps/desktop/scripts/signer-lock.mjs "$signer"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$signer"
          "$signer/node_modules/.bin/tauri" --version

      - name: Release notes
        run: env -u GITHUB_OUTPUT node apps/desktop/scripts/release-notes.mjs > dist/notes.md

      - name: Sign installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          "${RUNNER_TEMP}/signer/node_modules/.bin/tauri" signer sign dist/ludra-installer.exe
          test -s dist/ludra-installer.exe.sig

      - name: Update manifest
        env:
          URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ludra-installer.exe
        run: |
          node apps/desktop/scripts/updater-manifest.mjs \
            --notes dist/notes.md \
            --signature dist/ludra-installer.exe.sig \
            --url "$URL" \
            --out dist/latest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Ludra $TAG" \
            --notes-file dist/notes.md \
            dist/ludra-installer.exe \
            dist/latest.json
